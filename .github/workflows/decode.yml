name: decode-assets
on:
  push:
    branches: [gh-pages]
    paths: ['**.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(git ls-files '*.b64'); do base64 -d "$f" > "${f%.b64}"; git rm -q "$f"; git add "${f%.b64}"; done
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Decode image assets" && git push
